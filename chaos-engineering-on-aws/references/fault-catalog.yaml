# Unified Fault Type Catalog
# Four-tier structure: Chaos Mesh (Pod/container) → FIS (single action) → FIS SSM (template library) → FIS Scenarios (composite)
#
# Usage: LLM reads this file in Step 3 to select the appropriate fault injection tool.
#   - AZ/region-level compound faults → fis_scenarios (composite: true)
#   - AWS infrastructure-level faults → fis (single action)
#   - AWS faults with no native FIS action → fis_ssm (SSM document from fis-template-library)
#   - K8s Pod/container-level faults → chaosmesh
#
# Adding new fault types: append to the appropriate section below. No need to modify SKILL.md.
#
# === Quick Index (54 faults) ===
# Chaos Mesh (14):
#   Compute:  pod_kill, pod_failure, container_kill
#   Network:  network_delay, network_loss, network_partition, network_bandwidth
#   HTTP:     http_abort, http_delay
#   Resource: cpu_stress, memory_stress
#   IO/DNS:   io_latency, io_fault, dns_error
#
# FIS Single Action (24):
#   EC2:        ec2_terminate, ec2_stop, ec2_reboot, ec2_spot_interruption, ec2_network_disrupt
#   EKS:        eks_terminate_nodes
#   RDS:        rds_failover, rds_reboot
#   Lambda:     lambda_delay, lambda_error
#   Network:    network_disrupt, network_cross_region_route
#   Storage:    ebs_pause_io, dynamodb_pause_replication, s3_pause_replication
#   API:        api_internal_error, api_throttle, api_unavailable_error
#   ECS:        ecs_stop_task, ecs_drain_container_instance, ecs_task_cpu_stress,
#               ecs_task_io_stress, ecs_task_network_blackhole
#   Cache:      elasticache_az_power
#
# FIS SSM (template library) (12):
#   Streaming:  msk_broker_reboot
#   Cache:      elasticache_primary_reboot, elasticache_primary_failover, redis_connection_failure
#   Database:   db_connection_exhaustion, db_blocking_locks, db_io_exhaustion, aurora_global_failover
#   Messaging:  sqs_queue_impairment
#   CDN:        cloudfront_impairment
#   AI agent:   agentcore_tool_faults
#   Compute:    windows_iis_stop
#
# FIS Scenario (4):
#   az_power_interruption, az_app_slowdown, cross_az_traffic_slowdown, cross_region_connectivity

# ── Chaos Mesh: Pod/Container Layer ─────────────────────────────────────────
chaosmesh:
  # -- Pod Lifecycle --
  - type: pod_kill
    backend: chaosmesh
    category: compute
    crd: PodChaos
    description: "Kill target Pods randomly, verify K8s self-healing"
    default_params:
      action: pod-kill
      mode: fixed-percent
      value: "50"
      duration: "2m"
    safe_first_run_params:
      action: pod-kill
      mode: fixed
      value: "1"
      duration: "2m"
    prerequisites:
      - "Chaos Mesh installed in cluster"
      - "Target Deployment replicas >= 2"
    recommended_for: [eks-microservices]

  - type: pod_failure
    backend: chaosmesh
    category: compute
    crd: PodChaos
    description: "Make Pods unavailable (replaced with pause image)"
    default_params:
      action: pod-failure
      mode: one
      duration: "5m"
    safe_first_run_params:
      action: pod-failure
      mode: one
      duration: "2m"
    prerequisites:
      - "Chaos Mesh installed in cluster"
    recommended_for: [eks-microservices]

  - type: container_kill
    backend: chaosmesh
    category: compute
    crd: PodChaos
    description: "Kill a specific container within a Pod"
    default_params:
      action: container-kill
      mode: one
      duration: "2m"
    safe_first_run_params:
      action: container-kill
      mode: one
      duration: "1m"
    prerequisites:
      - "Chaos Mesh installed in cluster"
      - "Multi-container Pod (sidecar pattern)"
    recommended_for: [eks-microservices]

  # -- Network --
  - type: network_delay
    backend: chaosmesh
    category: network
    crd: NetworkChaos
    description: "Inject network delay between services"
    default_params:
      action: delay
      latency: "200ms"
      jitter: "50ms"
      mode: all
      duration: "5m"
    safe_first_run_params:
      action: delay
      latency: "50ms"
      jitter: "10ms"
      mode: one
      duration: "2m"
    prerequisites:
      - "Chaos Mesh installed in cluster"
    recommended_for: [eks-microservices]

  - type: network_loss
    backend: chaosmesh
    category: network
    crd: NetworkChaos
    description: "Inject packet loss between services"
    default_params:
      action: loss
      loss: "30"
      mode: all
      duration: "5m"
    safe_first_run_params:
      action: loss
      loss: "5"
      mode: one
      duration: "2m"
    prerequisites:
      - "Chaos Mesh installed in cluster"
    recommended_for: [eks-microservices]

  - type: network_partition
    backend: chaosmesh
    category: network
    crd: NetworkChaos
    description: "Create network partition between services"
    default_params:
      action: partition
      direction: both
      mode: all
      duration: "5m"
    safe_first_run_params:
      action: partition
      direction: to
      mode: one
      duration: "2m"
    prerequisites:
      - "Chaos Mesh installed in cluster"
    recommended_for: [eks-microservices]

  - type: network_bandwidth
    backend: chaosmesh
    category: network
    crd: NetworkChaos
    description: "Limit network bandwidth"
    default_params:
      action: bandwidth
      rate: "1mbps"
      mode: all
      duration: "5m"
    safe_first_run_params:
      action: bandwidth
      rate: "10mbps"
      mode: one
      duration: "2m"
    prerequisites:
      - "Chaos Mesh installed in cluster"
    recommended_for: [eks-microservices]

  # -- HTTP Layer --
  - type: http_abort
    backend: chaosmesh
    category: http
    crd: HTTPChaos
    description: "Abort HTTP connections to target service"
    default_params:
      abort: true
      port: 80
      mode: all
      duration: "3m"
    safe_first_run_params:
      abort: true
      port: 80
      mode: one
      duration: "1m"
    prerequisites:
      - "Chaos Mesh installed in cluster"
      - "Target service uses HTTP"
    recommended_for: [eks-microservices]

  - type: http_delay
    backend: chaosmesh
    category: http
    crd: HTTPChaos
    description: "Inject delay into HTTP responses"
    default_params:
      delay: "3s"
      port: 80
      mode: all
      duration: "5m"
    safe_first_run_params:
      delay: "1s"
      port: 80
      mode: one
      duration: "2m"
    prerequisites:
      - "Chaos Mesh installed in cluster"
      - "Target service uses HTTP"
    recommended_for: [eks-microservices]

  # -- Resource Stress --
  - type: cpu_stress
    backend: chaosmesh
    category: stress
    crd: StressChaos
    description: "CPU stress on target Pods"
    default_params:
      workers: 2
      load: 80
      duration: "5m"
    safe_first_run_params:
      workers: 1
      load: 30
      duration: "2m"
    prerequisites:
      - "Chaos Mesh installed in cluster"
      - "Pod resource limits configured"
    recommended_for: [eks-microservices]

  - type: memory_stress
    backend: chaosmesh
    category: stress
    crd: StressChaos
    description: "Memory stress on target Pods"
    default_params:
      workers: 1
      size: "256MB"
      duration: "5m"
    safe_first_run_params:
      workers: 1
      size: "64MB"
      duration: "2m"
    prerequisites:
      - "Chaos Mesh installed in cluster"
      - "Pod resource limits configured"
    recommended_for: [eks-microservices]

  # -- IO --
  - type: io_latency
    backend: chaosmesh
    category: io
    crd: IOChaos
    description: "Inject file IO latency"
    default_params:
      action: latency
      delay: "100ms"
      duration: "5m"
    safe_first_run_params:
      action: latency
      delay: "30ms"
      duration: "2m"
    prerequisites:
      - "Chaos Mesh installed in cluster"
    recommended_for: [eks-microservices]

  - type: io_fault
    backend: chaosmesh
    category: io
    crd: IOChaos
    description: "Inject file IO errors"
    default_params:
      action: fault
      errno: 5
      duration: "3m"
    safe_first_run_params:
      action: fault
      errno: 5
      duration: "1m"
    prerequisites:
      - "Chaos Mesh installed in cluster"
    recommended_for: [eks-microservices]

  # -- DNS --
  - type: dns_error
    backend: chaosmesh
    category: dns
    crd: DNSChaos
    description: "DNS resolution returns error"
    default_params:
      action: error
      mode: all
      duration: "3m"
    safe_first_run_params:
      action: error
      mode: one
      duration: "1m"
    prerequisites:
      - "Chaos Mesh installed in cluster"
      - "Chaos Mesh DNS server enabled"
    recommended_for: [eks-microservices]

# ── FIS: AWS Infrastructure Single Actions ──────────────────────────────────
fis:
  # -- EC2 --
  - type: ec2_terminate
    backend: fis
    category: compute
    fis_action_id: "aws:ec2:terminate-instances"
    description: "Terminate EC2 instances (SPOF validation)"
    default_params:
      duration: "5m"
    safe_first_run_params:
      duration: "5m"
      # Note: set target selectionMode=COUNT with count=1 in experiment template
    prerequisites:
      - "FIS IAM Role with ec2:TerminateInstances"
      - "ASG or replacement mechanism in place"
    recommended_for: [ec2-traditional, eks-microservices]

  - type: ec2_stop
    backend: fis
    category: compute
    fis_action_id: "aws:ec2:stop-instances"
    description: "Stop EC2 instances (recoverable)"
    default_params:
      duration: "5m"
      startInstancesAfterDuration: "PT5M"
    safe_first_run_params:
      duration: "PT3M"
      startInstancesAfterDuration: "PT3M"
      # Note: set target selectionMode=COUNT with count=1 in experiment template
    prerequisites:
      - "FIS IAM Role with ec2:StopInstances, ec2:StartInstances"
    recommended_for: [ec2-traditional]

  - type: ec2_reboot
    backend: fis
    category: compute
    fis_action_id: "aws:ec2:reboot-instances"
    description: "Reboot EC2 instances"
    default_params: {}
    safe_first_run_params:
      # Note: set target selectionMode=COUNT with count=1 in experiment template
    prerequisites:
      - "FIS IAM Role with ec2:RebootInstances"
    recommended_for: [ec2-traditional]

  - type: ec2_spot_interruption
    backend: fis
    category: compute
    fis_action_id: "aws:ec2:send-spot-instance-interruptions"
    description: "Simulate Spot instance interruptions"
    default_params:
      durationBeforeInterruption: "PT2M"
    safe_first_run_params:
      durationBeforeInterruption: "PT2M"
      # Note: set target selectionMode=COUNT with count=1 in experiment template
    prerequisites:
      - "FIS IAM Role with ec2:SendSpotInstanceInterruptions"
      - "Target instances are Spot instances"
    recommended_for: [ec2-traditional, eks-microservices]

  - type: ec2_network_disrupt
    backend: fis
    category: network
    fis_action_id: "aws:network:disrupt-connectivity"
    target_resource_type: "aws:ec2:subnet"
    description: "Isolate EC2 workloads by denying traffic on the subnets they run in (FIS clones the subnet's NACL, adds deny rules, restores the original association at the end). There is no per-instance EC2 network action; the target is the subnet."
    default_params:
      duration: "PT5M"           # PT1M .. PT12H
      scope: "all"               # all | availability-zone | dynamodb | prefix-list | s3 | s3express | vpc
      # prefixListIdentifier: "<name|id|arn>"   # only with scope=prefix-list; customer-managed list, max 10 entries
    safe_first_run_params:
      duration: "PT2M"
      scope: "all"
      # Note: target one dedicated subnet (selectionMode=COUNT(1)); every ENI in the subnet is affected
    important_notes:
      - "scope=all denies all traffic entering and leaving the subnet but still allows intra-subnet traffic"
      - "When scope is not all, the network ACL can hold at most 20 entries"
      - "scope=availability-zone denies intra-VPC traffic to/from subnets in other AZs; at most 30 subnets per VPC"
    prerequisites:
      - "FIS IAM Role with ec2:CreateNetworkAcl (creates the NACL tagged managedByFIS=true), ec2:CreateNetworkAclEntry and ec2:DeleteNetworkAcl (NACL must be tagged managedByFIS=true), ec2:CreateTags, ec2:DescribeManagedPrefixLists, ec2:DescribeNetworkAcls, ec2:DescribeSubnets, ec2:DescribeVpcs, ec2:GetManagedPrefixListEntries, ec2:ReplaceNetworkAclAssociation"
      - "Target subnets tagged or listed in the experiment template (resource type aws:ec2:subnet)"
    recommended_for: [ec2-traditional]

  # -- EKS --
  - type: eks_terminate_nodes
    backend: fis
    category: compute
    fis_action_id: "aws:eks:terminate-nodegroup-instances"
    description: "Terminate EKS node group instances (recommended for node-level)"
    default_params:
      instanceTerminationPercentage: "30"
    safe_first_run_params:
      instanceTerminationPercentage: "10"
    prerequisites:
      - "FIS IAM Role with eks:* and ec2:TerminateInstances"
      - "Managed node group or ASG-backed nodes"
    recommended_for: [eks-microservices]

  # -- RDS --
  - type: rds_failover
    backend: fis
    category: data
    fis_action_id: "aws:rds:failover-db-cluster"
    description: "Aurora/RDS cluster failover"
    default_params: {}
    safe_first_run_params:
      # Single failover is inherently atomic — no percentage to reduce.
      # Ensure a reader instance exists and test during a low-traffic window.
    prerequisites:
      - "FIS IAM Role with rds:FailoverDBCluster"
      - "Multi-AZ cluster with reader instance"
    recommended_for: [all]

  - type: rds_reboot
    backend: fis
    category: data
    fis_action_id: "aws:rds:reboot-db-instances"
    description: "Reboot RDS instances"
    default_params: {}
    safe_first_run_params:
      # Note: set target selectionMode=COUNT with count=1 in experiment template
    prerequisites:
      - "FIS IAM Role with rds:RebootDBInstance"
    recommended_for: [all]

  # -- Lambda --
  - type: lambda_delay
    backend: fis
    category: serverless
    fis_action_id: "aws:lambda:invocation-add-delay"
    description: "Inject delay into Lambda invocations"
    default_params:
      duration: "PT5M"
      startupDelayMilliseconds: "2000"
      invocationPercentage: "100"
    safe_first_run_params:
      duration: "PT2M"
      startupDelayMilliseconds: "500"
      invocationPercentage: "10"
    prerequisites:
      - "S3 bucket in the Region you start the experiment from (one bucket per Region; can be shared across experiments and accounts) with a config folder, e.g. FisConfigs/"
      - "Lambda execution role: read access to the config location — s3:ListBucket on arn:aws:s3:::<BUCKET> with Condition StringLike s3:prefix [\"FisConfigs/*\"], and s3:GetObject on arn:aws:s3:::<BUCKET>/FisConfigs/*"
      - "FIS experiment role: write access to the config location — s3:PutObject, s3:DeleteObject on arn:aws:s3:::<BUCKET>/FisConfigs/*; plus lambda:GetFunction and tag:GetResources on *"
      - "Lambda function ARN (target resource type aws:lambda:function)"
      - "⚠️ Target Lambda MUST have FIS Extension Layer installed"
      - "⚠️ Target Lambda MUST have env var AWS_FIS_CONFIGURATION_LOCATION = S3 ARN of the config folder, e.g. arn:aws:s3:::my-config-distribution-bucket/FisConfigs/ (S3 ARN format — not an s3:// URI, not an experiment ARN)"
      - "⚠️ Target Lambda MUST have env var AWS_LAMBDA_EXEC_WRAPPER = /opt/aws-fis/bootstrap"
      - "Not supported for functions that use response streaming"
    setup_commands: |
      # Source: https://docs.aws.amazon.com/fis/latest/userguide/use-lambda-actions.html
      # How it works: FIS reads AWS_FIS_CONFIGURATION_LOCATION from the function, writes the active
      # fault configuration to that S3 folder while the experiment runs, and the extension polls and
      # reads it. The variable is set once; it does not change per experiment.
      #
      # Step 1: One-time — S3 bucket + folder in the experiment's Region, and two IAM policies:
      #   Lambda execution role (read):
      #     {"Sid":"AllowListingConfigLocation","Effect":"Allow","Action":["s3:ListBucket"],
      #      "Resource":["arn:aws:s3:::<BUCKET>"],"Condition":{"StringLike":{"s3:prefix":["FisConfigs/*"]}}}
      #     {"Sid":"AllowReadingObjectFromConfigLocation","Effect":"Allow","Action":"s3:GetObject",
      #      "Resource":["arn:aws:s3:::<BUCKET>/FisConfigs/*"]}
      #   FIS experiment role (write):
      #     {"Sid":"AllowFisToWriteAndDeleteFaultConfigurations","Effect":"Allow",
      #      "Action":["s3:PutObject","s3:DeleteObject"],"Resource":"arn:aws:s3:::<BUCKET>/FisConfigs/*"}
      #     {"Sid":"AllowFisToInspectLambdaFunctions","Effect":"Allow","Action":["lambda:GetFunction"],"Resource":"*"}
      #     {"Sid":"AllowFisToDoTagLookups","Effect":"Allow","Action":["tag:GetResources"],"Resource":"*"}
      #
      # Step 2: Per function — attach the FIS extension layer and set both variables.
      # Find the layer ARN for your Region/architecture under "Available versions of the AWS FIS
      # extension for Lambda" in the FIS user guide.
      # ⚠️ --layers and --environment REPLACE the whole list/map: read the current values first
      #    and pass every existing layer ARN and variable back together with the new ones.
      aws lambda get-function-configuration --function-name <FUNCTION_NAME> \
        --query '{Layers:Layers[].Arn, EnvVars:Environment.Variables}' --region <REGION>
      aws lambda update-function-configuration \
        --function-name <FUNCTION_NAME> \
        --layers <EXISTING_LAYER_ARNS...> <FIS_EXTENSION_LAYER_ARN> \
        --environment "Variables={AWS_FIS_CONFIGURATION_LOCATION=arn:aws:s3:::<BUCKET>/FisConfigs/,AWS_LAMBDA_EXEC_WRAPPER=/opt/aws-fis/bootstrap,<EXISTING_VARS>}" \
        --region <REGION>
      # Step 3: Verify (both variables present, FIS layer listed alongside the original layers)
      aws lambda get-function-configuration --function-name <FUNCTION_NAME> \
        --query '{Layers:Layers[].Arn, EnvVars:Environment.Variables}' --region <REGION>
      #
      # Timing: faults can take up to 60 s to reach all invocations (extension slow-poll interval,
      # AWS_FIS_SLOW_POLL_INTERVAL_SECONDS, default 60) and up to ~20 s to stop after the action ends.
    recommended_for: [serverless]

  - type: lambda_error
    backend: fis
    category: serverless
    fis_action_id: "aws:lambda:invocation-error"
    description: "Inject errors into Lambda invocations"
    default_params:
      duration: "PT5M"
      invocationPercentage: "50"
    safe_first_run_params:
      duration: "PT2M"
      invocationPercentage: "10"
    prerequisites:
      - "S3 bucket + config folder in the experiment's Region (same as lambda_delay)"
      - "Lambda execution role: s3:ListBucket (s3:prefix FisConfigs/*) + s3:GetObject on <BUCKET>/FisConfigs/*"
      - "FIS experiment role: s3:PutObject, s3:DeleteObject on <BUCKET>/FisConfigs/*; lambda:GetFunction, tag:GetResources"
      - "Lambda function ARN (target resource type aws:lambda:function)"
      - "⚠️ Target Lambda MUST have FIS Extension Layer installed"
      - "⚠️ Target Lambda MUST have env var AWS_FIS_CONFIGURATION_LOCATION = S3 ARN of the config folder, e.g. arn:aws:s3:::my-config-distribution-bucket/FisConfigs/"
      - "⚠️ Target Lambda MUST have env var AWS_LAMBDA_EXEC_WRAPPER = /opt/aws-fis/bootstrap"
    setup_commands: |
      # Same as lambda_delay — see lambda_delay.setup_commands
      # (https://docs.aws.amazon.com/fis/latest/userguide/use-lambda-actions.html)
    recommended_for: [serverless]

  # -- Network --
  - type: network_disrupt
    backend: fis
    category: network
    fis_action_id: "aws:network:disrupt-connectivity"
    description: "Subnet/SG-level network disruption (AZ isolation)"
    default_params:
      duration: "PT5M"
      scope: "all"
    safe_first_run_params:
      duration: "PT2M"
      scope: "all"
      # Note: target a single subnet or non-critical AZ first
    prerequisites:
      - "FIS IAM Role with ec2:CreateNetworkAcl*, ec2:DeleteNetworkAcl*"
      - "Multi-AZ deployment"
    recommended_for: [multi-az, ec2-traditional, eks-microservices]

  - type: network_cross_region_route
    backend: fis
    category: network
    fis_action_id: "aws:network:route-table-disrupt-cross-region-connectivity"
    description: "Cross-region route table disruption"
    default_params:
      duration: "PT5M"
    safe_first_run_params:
      duration: "PT2M"
      # Warning: high blast radius — must validate in non-production first
    prerequisites:
      - "FIS IAM Role with ec2:CreateRoute, ec2:DeleteRoute, ec2:ReplaceRoute"
      - "Multi-region architecture with VPC Peering or TGW"
    recommended_for: [multi-region]

  # -- Storage --
  - type: ebs_pause_io
    backend: fis
    category: storage
    fis_action_id: "aws:ebs:pause-volume-io"
    description: "Pause EBS volume IO"
    default_params:
      duration: "PT5M"
    safe_first_run_params:
      duration: "PT2M"
      # Note: set target selectionMode=COUNT with count=1 in experiment template
    prerequisites:
      - "FIS IAM Role with ec2:PauseVolumeIO"
      - "EBS volume attached to target instance"
    recommended_for: [ec2-traditional, eks-microservices]

  # -- DynamoDB --
  - type: dynamodb_pause_replication
    backend: fis
    category: data
    fis_action_id: "aws:dynamodb:global-table-pause-replication"
    description: "Pause DynamoDB global table replication"
    default_params:
      duration: "PT5M"
    safe_first_run_params:
      duration: "PT2M"
    prerequisites:
      - "FIS IAM Role with dynamodb:* permissions"
      - "DynamoDB Global Table configured"
    recommended_for: [multi-region, serverless]

  # -- ElastiCache --
  - type: elasticache_az_power
    backend: fis
    category: cache
    fis_action_id: "aws:elasticache:replicationgroup-interrupt-az-power"
    target_resource_type: "aws:elasticache:replicationgroup"
    description: "Interrupt power to the nodes of target replication groups in one AZ; a primary in that AZ is replaced by the replica with the least replication lag, and replica replacements in the AZ are blocked for the duration"
    default_params:
      duration: "PT10M"          # PT1M .. PT12H; fis-template-library default
      # target parameter: availabilityZoneIdentifier: "<AZ name or AZ ID>"
    safe_first_run_params:
      duration: "PT5M"
      # Power loss started 42-74 s after the action began in library tests; keep duration well above that
    important_notes:
      - "Only one AZ per replication group can be impacted at a time"
      - "Supports Redis and Valkey engines; does NOT support ElastiCache Serverless"
      - "Target with resourceTags/filters; resourceArns targeting is rejected (fis-template-library elasticache-az-power-interruption)"
      - "A stop ends the interruption but does not undo the failover; in library tests the node in the AZ answered PING again ~9-10 min after the end although the group showed available within 2 min"
    prerequisites:
      - "FIS IAM Role with elasticache:InterruptClusterAzPower, elasticache:DescribeReplicationGroups, tag:GetResources"
      - "Replication group with Multi-AZ enabled (AutomaticFailover=enabled)"
    template_source: "https://github.com/aws-samples/fis-template-library/tree/main/elasticache-az-power-interruption"
    recommended_for: [multi-az]

  # -- S3 --
  - type: s3_pause_replication
    backend: fis
    category: storage
    fis_action_id: "aws:s3:bucket-pause-replication"
    description: "Pause S3 cross-region replication"
    default_params:
      duration: "PT10M"
    safe_first_run_params:
      duration: "PT3M"
    prerequisites:
      - "FIS IAM Role with s3:PutReplicationConfiguration"
      - "S3 CRR configured"
    recommended_for: [multi-region]

  # -- FIS API Errors (ec2 and kinesis ONLY) --
  - type: api_internal_error
    backend: fis
    category: api
    fis_action_id: "aws:fis:inject-api-internal-error"
    description: "Inject 500 errors into AWS API calls made by the target IAM role"
    important_notes:
      - "⚠️ ONLY supports service=ec2 and service=kinesis (AWS doc confirmed)"
      - "Does NOT work with: DynamoDB, S3, RDS, Lambda, ELB, or any other service"
      - "For other services, use their dedicated FIS Actions instead"
      - "Targets IAM role, NOT a specific service endpoint"
      - "'operations' param can filter to specific API actions (e.g., DescribeInstances)"
    supported_services: [ec2, kinesis]
    NOT_supported:
      - dynamodb  # Use aws:dynamodb:global-table-pause-replication
      - lambda    # Use aws:lambda:invocation-add-delay / invocation-error
      - s3        # Use aws:s3:bucket-pause-replication
      - rds       # Use aws:rds:failover-db-cluster / reboot-db-instances
      - ebs       # Use aws:ebs:pause-volume-io
    default_params:
      duration: "PT5M"
      percentage: "100"
      service: "ec2"            # MUST be ec2 or kinesis
      operations: "DescribeInstances"
    safe_first_run_params:
      duration: "PT2M"
      percentage: "10"
      service: "ec2"
      operations: "DescribeInstances"
    prerequisites:
      - "Target IAM Role ARN required"
      - "fis:InjectApiInternalError permission"
    recommended_for: [all]

